name: TACO V6.11 Automated Release Gate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "RC 版本，例如 6.11.0"
        required: true
        default: "6.11.0"
        type: string
      rc_tag:
        description: "已發布的 prerelease tag，例如 rc-6.11.0"
        required: true
        default: "rc-6.11.0"
        type: string

permissions:
  contents: write

concurrency:
  group: taco-rc-validation-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  automated-release-gate:
    name: Package, migration, replacement and rollback gates
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_RC_TAG: ${{ inputs.rc_tag }}

    steps:
      - name: Check out release-gate scripts
        uses: actions/checkout@v4

      - name: Validate inputs and RC release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:INPUT_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          if ($env:INPUT_RC_TAG -ne "rc-$env:INPUT_VERSION") { throw "rc_tag must be exactly rc-$env:INPUT_VERSION" }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:INPUT_RC_TAG" | ConvertFrom-Json
          if ($release.tag_name -ne $env:INPUT_RC_TAG) { throw 'RC tag mismatch' }
          if (-not $release.prerelease) { throw 'RC release must be marked prerelease' }
          if ($release.draft) { throw 'RC release must be published, not draft' }

      - name: Download exact RC package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path rc -Force | Out-Null
          $asset = "TACO_Update_$env:INPUT_VERSION`_win-x64.zip"
          gh release download $env:INPUT_RC_TAG --repo $env:GITHUB_REPOSITORY --pattern $asset --dir rc --clobber
          $path = Join-Path $PWD "rc\$asset"
          if (-not (Test-Path -LiteralPath $path) -or (Get-Item -LiteralPath $path).Length -eq 0) { throw 'RC package download failed' }
          "ASSET=$asset" >> $env:GITHUB_ENV

      - name: Run all four release gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $PWD "rc\RC_VALIDATION_$env:INPUT_VERSION.txt"
          $checksum = Join-Path $PWD "rc\CHECKSUMS_RC_$env:INPUT_VERSION`_SHA256.txt"
          ./scripts/Test-TacoReleaseGate.ps1 `
            -Package (Join-Path $PWD "rc\$env:ASSET") `
            -Version $env:INPUT_VERSION `
            -RcTag $env:INPUT_RC_TAG `
            -WorkDir (Join-Path $env:RUNNER_TEMP 'taco-release-gate') `
            -ReportPath $report `
            -ChecksumPath $checksum
          "REPORT=$([IO.Path]::GetFileName($report))" >> $env:GITHUB_ENV
          "CHECKSUM=$([IO.Path]::GetFileName($checksum))" >> $env:GITHUB_ENV

      - name: Publish gate evidence to RC release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release upload $env:INPUT_RC_TAG `
            "rc\$env:REPORT" `
            "rc\$env:CHECKSUM" `
            --repo $env:GITHUB_REPOSITORY `
            --clobber

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taco-release-gate-${{ inputs.version }}-${{ github.run_id }}
          path: |
            rc/*.txt
            ${{ runner.temp }}/taco-release-gate/**/update_history.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Write workflow summary
        if: success()
        shell: pwsh
        run: |
          @(
            '## TACO V6.11 Automated Release Gate PASS'
            ''
            "- Version: $env:INPUT_VERSION"
            "- RC tag: $env:INPUT_RC_TAG"
            "- Package: $env:ASSET"
            '- Gate 1 — RC package validation: PASS'
            '- Gate 2 — Schema 3 → 5 migration and data integrity: PASS'
            '- Gate 3 — Successful updater replacement: PASS'
            '- Gate 4 — Forced failure, non-zero exit and byte-for-byte rollback: PASS'
            '- Production signing: not performed; use the protected promotion workflow after review.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
