name: TACO RC Update Validation

on:
  workflow_dispatch:
    inputs:
      version:
        description: "RC 版本，例如 6.11.0"
        required: true
        type: string
      rc_tag:
        description: "RC Release tag，例如 rc-6.11.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: taco-rc-validation-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate unsigned RC package
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid version"
            exit 1
          }

          [[ "${{ inputs.rc_tag }}" =~ ^rc-[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9_-]+)?$ ]] || {
            echo "Invalid rc_tag"
            exit 1
          }

      - name: Verify RC release exists and is prerelease
        shell: bash
        run: |
          set -euo pipefail

          API_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ inputs.rc_tag }}"

          JSON=$(curl \
            --fail \
            --silent \
            --show-error \
            --location \
            -H "Accept: application/vnd.github+json" \
            "$API_URL")

          PRERELEASE=$(printf '%s' "$JSON" | jq -r '.prerelease')
          DRAFT=$(printf '%s' "$JSON" | jq -r '.draft')
          TAG=$(printf '%s' "$JSON" | jq -r '.tag_name')

          test "$TAG" = "${{ inputs.rc_tag }}" || {
            echo "RC tag mismatch"
            exit 1
          }

          test "$PRERELEASE" = "true" || {
            echo "RC release must be marked as prerelease"
            exit 1
          }

          test "$DRAFT" = "false" || {
            echo "RC release must be published, not draft"
            exit 1
          }

          echo "RC release verification PASS"

      - name: Download exact RC package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p rc

          ASSET="TACO_Update_${{ inputs.version }}_win-x64.zip"

          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ inputs.rc_tag }}/$ASSET"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --output "rc/$ASSET" \
            "$DOWNLOAD_URL"

          test -s "rc/$ASSET"

          echo "Downloaded:"
          ls -lh "rc/$ASSET"

          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Validate ZIP structure and reject secrets
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          import zipfile
          from pathlib import PurePosixPath

          path = os.path.join("rc", os.environ["ASSET"])

          banned_names = {
              "license_private_key.pem",
              "update_private_key.pem",
              "licenses.db",
              ".env",
              "id_rsa",
              "id_ed25519",
          }

          banned_ext = {".pfx", ".p12", ".key"}

          max_uncompressed = 2 * 1024 * 1024 * 1024
          total = 0
          exe_count = 0

          with zipfile.ZipFile(path) as zf:
              bad = zf.testzip()

              if bad:
                  raise SystemExit(f"ZIP CRC failure: {bad}")

              for info in zf.infolist():
                  raw = info.filename.replace("\\", "/")
                  p = PurePosixPath(raw)

                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"Unsafe ZIP path: {raw}")

                  name = p.name.lower()
                  suffix = p.suffix.lower()

                  if name in banned_names or suffix in banned_ext:
                      raise SystemExit(
                          f"Forbidden secret/key material in RC: {raw}"
                      )

                  if re.search(
                      r"(^|/)(secret|secrets)(/|$)",
                      raw.lower()
                  ):
                      raise SystemExit(
                          f"Forbidden secret directory in RC: {raw}"
                      )

                  total += info.file_size

                  if total > max_uncompressed:
                      raise SystemExit(
                          "RC uncompressed size exceeds 2 GiB safety limit"
                      )

                  if suffix == ".exe":
                      exe_count += 1

              if exe_count == 0:
                  raise SystemExit(
                      "RC package contains no Windows executable"
                  )

          print(
              f"ZIP validation PASS; "
              f"executables={exe_count}; "
              f"uncompressed_bytes={total}"
          )
          PY

      - name: Calculate SHA-256 and create validation report
        shell: bash
        run: |
          set -euo pipefail

          HASH=$(sha256sum "rc/$ASSET" | awk '{print $1}')
          NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          REPORT="RC_VALIDATION_${{ inputs.version }}.txt"
          CHECKSUM="CHECKSUMS_RC_${{ inputs.version }}_SHA256.txt"

          printf '%s  %s\n' \
            "$HASH" \
            "$ASSET" \
            > "rc/$CHECKSUM"

          cat > "rc/$REPORT" <<EOF
          TACO RC Validation
          version=${{ inputs.version }}
          rc_tag=${{ inputs.rc_tag }}
          validated_at_utc=$NOW
          package=$ASSET
          sha256=$HASH
          zip_crc=PASS
          path_traversal_check=PASS
          secret_material_check=PASS
          windows_executable_check=PASS
          result=PASS
          EOF

          echo "PACKAGE_SHA256=$HASH" >> "$GITHUB_ENV"
          echo "REPORT=$REPORT" >> "$GITHUB_ENV"
          echo "CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"

      - name: Publish RC validation evidence
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "${{ inputs.rc_tag }}" \
            "rc/$REPORT" \
            "rc/$CHECKSUM" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Write workflow summary
        shell: bash
        run: |
          {
            echo "## TACO RC Validation PASS"
            echo ""
            echo "- Version: ${{ inputs.version }}"
            echo "- RC tag: ${{ inputs.rc_tag }}"
            echo "- Package: $ASSET"
            echo "- SHA-256: \`$PACKAGE_SHA256\`"
            echo "- ZIP CRC / path traversal / secret-material / executable checks: PASS"
            echo "- Next: manual RC functional testing, then production promotion workflow."
          } >> "$GITHUB_STEP_SUMMARY"